[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ooptdd-mutation"
version = "0.1.0"
description = "Optional mutation analysis and bounded mutation-cycle profile for OOPTDD."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["ooptdd>=0.6,<0.7", "ooptdd-trajectory>=0.1,<0.2"]

[project.scripts]
ooptdd-mutation = "ooptdd_mutation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ooptdd_mutation"]

[tool.hatch.build.targets.sdist]
include = ["/src/ooptdd_mutation", "/README.md", "/pyproject.toml"]
exclude = [
  "/.ruff_cache/**",
  "/.pytest_cache/**",
  "/.mypy_cache/**",
  "/**/__pycache__/**",
  "/**/*.pyc",
  "/**/*.pyo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../ooptdd-trajectory/src", "../../src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
check_untyped_defs = true
python_version = "3.10"
