[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ooptdd"
version = "0.6.0"
description = "A general event-contract framework for deterministic evaluation and positive arrival verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
keywords = ["event-contracts", "runtime-verification", "observability", "logs", "traces", "monitoring"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Topic :: System :: Monitoring",
  "Intended Audience :: Developers",
]
dependencies = [
  "PyYAML>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# >=1.38: the driver emits via the modern kwargs Logger.emit(body=, severity_number=, attributes=)
# form, which TypeErrors on <1.38 (bisected). The prior >=1.20 floor was inaccurate — the old
# emit(LogRecord(...)) API + the LogRecord import location both moved out from under it.
otel = ["opentelemetry-sdk>=1.38", "opentelemetry-exporter-otlp-proto-http>=1.38"]
pytest = ["pytest>=7.0"]
dev = [
  "pytest>=7.0",
  "pytest-xdist>=3.0",
  "ruff>=0.4",
  "mypy>=1.8",
  "tomli>=2.0",
  "types-PyYAML>=6.0",
]

[project.scripts]
ooptdd = "ooptdd.cli:main"

# Third-party backends register here:  [project.entry-points."ooptdd.backends"]
#   loki = "my_pkg.loki:LokiBackend"

[project.urls]
Homepage = "https://github.com/gj3447/ooptdd"
Documentation = "https://github.com/gj3447/ooptdd/blob/main/docs/quickstart.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ooptdd"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/ooptdd",
  "/README.md",
  "/SEMANTICS.md",
  "/SECURITY.md",
  "/LICENSE",
  "/pyproject.toml",
  "/docs/THREAT_MODEL.md",
  "/docs/architecture/functional-solid-contract.json",
  "/docs/architecture/functional-solid-harness.md",
  "/docs/architecture/ooptdd-ouroboros-readiness-contract.json",
  "/docs/architecture/ooptdd-ouroboros-readiness-harness.md",
  "/docs/backends.md",
  "/docs/ouroboros.md",
  "/docs/quickstart.md",
]
exclude = [
  "/.mypy_cache/**",
  "/.pytest_cache/**",
  "/.ruff_cache/**",
  "/.uv-cache/**",
  "/.venv/**",
  "/**/__pycache__/**",
  "/benchmarks/**",
  "/docs/receipts/**",
  "/docs/research/**",
  "/examples/**",
  "/extensions/**",
]

# ooptdd's own test suite runs with the in-memory backend (zero infra).
[tool.ooptdd]
backend = "memory"
service = "ooptdd.self-tests"

[tool.ooptdd.adapters.pytest]
verify = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
check_untyped_defs = true
python_version = "3.10"
